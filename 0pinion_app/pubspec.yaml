name: opinion_app
description: "0pinion — Debate, Not Doomscroll."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Backend & Auth
  supabase_flutter: ^2.14.2
  google_sign_in: ^6.2.2

  # Typography & UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  custom_refresh_indicator: ^4.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/launcher_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher_icon.png"
  web:
    generate: true
    image_path: "assets/launcher_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
